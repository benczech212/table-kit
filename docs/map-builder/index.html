<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Map Builder</title>
<meta name="description" content="Draw and generate square or hex battle maps in your browser, with fog of war and a live player view.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Grenze:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared.css">
<style>
html,body { height:100% }
body { display:flex; flex-direction:column; overflow:hidden }
.top { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding:6px 12px; background:var(--card); border-bottom:1px solid var(--line) }
.top h1 { font-size:1.7rem; margin-right:4px }
.top .suite { padding:0; font-size:.88rem }
.top select { width:auto; max-width:200px }
.top .grow { flex:1 }
.work { flex:1; min-height:0; display:grid; grid-template-columns:238px minmax(0,1fr) }
.side { overflow:auto; background:var(--card); border-right:1px solid var(--line); padding:10px; display:flex; flex-direction:column; gap:12px }
.side h3 { font-size:.95rem; color:var(--soft); margin-bottom:5px }
.tools { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px }
.tools button { padding:4px 2px; font-size:.85rem }
.swatches { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px }
.swatch { min-height:44px; padding:2px; font-size:.68rem; line-height:1.05; flex-direction:column; color:#14283f; text-shadow:0 0 3px #fff }
.swatch[aria-pressed="true"] { outline:3px solid var(--accent); outline-offset:-3px; color:#14283f; background:inherit }
.swatch.dark { color:#fff; text-shadow:0 0 3px #000 }
.swatch.dark[aria-pressed="true"] { color:#fff }
.stamps { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px }
.stamps button { padding:2px; min-height:48px; flex-direction:column; gap:0; font-size:.68rem; line-height:1.05 }
.stamps canvas { width:30px; height:30px }
.row { display:grid; grid-template-columns:1fr 1fr; gap:6px }
.stage { position:relative; min-width:0; min-height:0; background:#3b4652; overflow:hidden }
#c { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; cursor:crosshair }
.hud { position:absolute; left:8px; bottom:8px; background:rgba(12,24,38,.85); color:#eef4fa; padding:3px 9px; border-radius:3px; font-size:.85rem; pointer-events:none; max-width:calc(100% - 16px) }
.zoom { position:absolute; right:8px; bottom:8px; display:flex; gap:4px }
.zoom button { min-width:36px }
#msg { min-height:1.3em; font-size:.85rem; color:var(--soft) }
dialog { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:3px; width:min(440px,calc(100vw - 32px)); padding:16px }
dialog::backdrop { background:rgba(0,0,0,.45) }
.player .top,.player .side { display:none }
.player .work { grid-template-columns:minmax(0,1fr) }
.player #c { cursor:default }
@media (max-width:760px) {
  .work { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) 38vh }
  .side { order:2; border-right:0; border-top:1px solid var(--line) }
  .tools { grid-template-columns:repeat(5,minmax(0,1fr)) }
  .swatches,.stamps { grid-template-columns:repeat(6,minmax(0,1fr)) }
  .top .suite { width:100%; order:9 }
}
</style></head>
<body>
<header class="top">
  <h1>Map Builder</h1>
  <select id="pick" aria-label="Open a saved map"></select>
  <button id="new">New</button>
  <button id="gen">Generate</button>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
  <span class="grow"></span>
  <button id="player" title="Open a window to drag onto a second screen">Player view</button>
  <button id="png">PNG</button>
  <button id="exp">Export</button>
  <button id="imp">Import</button>
  <button id="del">Delete</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <nav class="suite" aria-label="Table Kit"><a href="../">Table Kit</a><a href="../hero-ledger/">Hero Ledger</a><b>Map Builder</b><a href="../story-manager/">Story Manager</a></nav>
</header>
<div class="work">
  <aside class="side">
    <div id="msg" role="status"></div>
    <div><h3>Tool</h3><div class="tools" id="tools"></div></div>
    <div id="opt"></div>
    <div><h3>This map</h3>
      <label class="f">Name<input type="text" id="name"></label>
      <div class="row" style="margin-top:6px">
        <label class="f">Width<input type="number" id="w" min="4" max="150"></label>
        <label class="f">Height<input type="number" id="h" min="4" max="150"></label>
        <label class="f">Each cell is<input type="number" id="scale" min="1" max="1000"></label>
        <label class="f">Unit<select id="unit"><option>ft</option><option>m</option><option>mi</option><option>km</option></select></label>
      </div>
      <div class="bar" style="margin-top:8px">
        <label><input type="checkbox" id="grid"> Grid</label>
        <label><input type="checkbox" id="fogon"> Fog</label>
      </div>
    </div>
  </aside>
  <div class="stage">
    <canvas id="c" tabindex="0" aria-label="Map canvas"></canvas>
    <div class="hud" id="hud"></div>
    <div class="zoom"><button id="zo" aria-label="Zoom out">-</button><button id="zf">Fit</button><button id="zi" aria-label="Zoom in">+</button></div>
  </div>
</div>
<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
<script>
"use strict";
const LS = "tablekit-maps", G = 40, $ = (i) => document.getElementById(i);
const isPlayer = new URLSearchParams(location.search).has("player");
if (isPlayer) document.body.classList.add("player");
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const lsPut = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { say("This browser's storage is full, so the map was not saved. Export it to keep it."); return false; } };
const say = (t) => { $("msg").textContent = t; };
const uid = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const TERRAIN = [
  { n: "Erase", c: null },
  { n: "Floor", c: "#d9d2c0" }, { n: "Stone", c: "#a7a79f" }, { n: "Wood", c: "#b98d5c" }, { n: "Dirt", c: "#a98a63" },
  { n: "Grass", c: "#a8c47c" }, { n: "Forest", c: "#5f8a52", d: 1 }, { n: "Hills", c: "#b7ad6d" }, { n: "Peaks", c: "#8a8378", d: 1 },
  { n: "Sand", c: "#e6d39b" }, { n: "Snow", c: "#eef3f6" }, { n: "Water", c: "#7fb2d6" }, { n: "Deep", c: "#3e77a8", d: 1 },
  { n: "Swamp", c: "#6f7f58", d: 1 }, { n: "Lava", c: "#d9572b", d: 1 }, { n: "Road", c: "#c9b48e" }, { n: "Void", c: "#22262c", d: 1 },
];
// Stamps are small vector drawings in a -1..1 box, so maps stay crisp at any zoom and in exported PNGs.
const line = (x, pts) => { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); };
const STAMPS = {
  Tree(x) { x.fillStyle = "#3f7040"; x.beginPath(); x.arc(0, -.15, .62, 0, 7); x.fill(); x.stroke(); x.fillStyle = "#6a4a2c"; x.fillRect(-.1, .4, .2, .45); },
  Pine(x) { x.fillStyle = "#2f5f47"; line(x, [[0, -.9], [.6, .1], [.28, .1], [.7, .7], [-.7, .7], [-.28, .1], [-.6, .1]]); x.closePath(); x.fill(); x.stroke(); },
  Peak(x) { x.fillStyle = "#857e72"; line(x, [[-.9, .7], [-.15, -.8], [.2, -.2], [.42, -.45], [.9, .7]]); x.closePath(); x.fill(); x.stroke(); x.fillStyle = "#fff"; line(x, [[-.42, -.25], [-.15, -.8], [.1, -.3], [-.15, -.42]]); x.closePath(); x.fill(); },
  Town(x) { x.fillStyle = "#c98d5a"; x.fillRect(-.7, -.05, .65, .7); x.strokeRect(-.7, -.05, .65, .7); x.fillRect(.05, .1, .65, .55); x.strokeRect(.05, .1, .65, .55); x.fillStyle = "#8e3b2c"; line(x, [[-.8, -.05], [-.38, -.6], [.05, -.05]]); x.closePath(); x.fill(); x.stroke(); line(x, [[-.03, .1], [.38, -.4], [.8, .1]]); x.closePath(); x.fill(); x.stroke(); },
  Castle(x) { x.fillStyle = "#9c9c98"; line(x, [[-.8, .75], [-.8, -.6], [-.5, -.6], [-.5, -.3], [-.2, -.3], [-.2, -.6], [.2, -.6], [.2, -.3], [.5, -.3], [.5, -.6], [.8, -.6], [.8, .75]]); x.closePath(); x.fill(); x.stroke(); x.fillStyle = "#3a3026"; x.beginPath(); x.moveTo(-.22, .75); x.lineTo(-.22, .25); x.arc(0, .25, .22, Math.PI, 0); x.lineTo(.22, .75); x.closePath(); x.fill(); },
  Door(x) { x.fillStyle = "#8c6239"; x.fillRect(-.45, -.75, .9, 1.5); x.strokeRect(-.45, -.75, .9, 1.5); x.fillStyle = "#222"; x.beginPath(); x.arc(.25, 0, .08, 0, 7); x.fill(); },
  Stairs(x) { x.fillStyle = "#c8c3b5"; x.fillRect(-.75, -.75, 1.5, 1.5); x.strokeRect(-.75, -.75, 1.5, 1.5); for (let i = 1; i < 5; i++) { const y = -.75 + i * .3; line(x, [[-.75, y], [.75, y]]); x.stroke(); } },
  Chest(x) { x.fillStyle = "#a06a30"; x.fillRect(-.7, -.35, 1.4, 1); x.strokeRect(-.7, -.35, 1.4, 1); line(x, [[-.7, 0], [.7, 0]]); x.stroke(); x.fillStyle = "#e3c04f"; x.fillRect(-.12, -.12, .24, .3); x.strokeRect(-.12, -.12, .24, .3); },
  Pillar(x) { x.fillStyle = "#b5b3ab"; x.beginPath(); x.arc(0, 0, .65, 0, 7); x.fill(); x.stroke(); x.beginPath(); x.arc(0, 0, .32, 0, 7); x.stroke(); },
  Trap(x) { x.strokeStyle = "#b3261e"; x.lineWidth = .14; line(x, [[-.6, -.6], [.6, .6]]); x.stroke(); line(x, [[.6, -.6], [-.6, .6]]); x.stroke(); x.beginPath(); x.arc(0, 0, .85, 0, 7); x.stroke(); },
  Altar(x) { x.fillStyle = "#d7d2c4"; x.fillRect(-.75, -.4, 1.5, .8); x.strokeRect(-.75, -.4, 1.5, .8); x.fillStyle = "#b3261e"; x.beginPath(); x.arc(0, 0, .17, 0, 7); x.fill(); },
  Well(x) { x.fillStyle = "#9b9b95"; x.beginPath(); x.arc(0, 0, .72, 0, 7); x.fill(); x.stroke(); x.fillStyle = "#3e77a8"; x.beginPath(); x.arc(0, 0, .42, 0, 7); x.fill(); x.stroke(); },
  Table(x) { x.fillStyle = "#a8783f"; x.fillRect(-.8, -.45, 1.6, .9); x.strokeRect(-.8, -.45, 1.6, .9); },
  Bed(x) { x.fillStyle = "#b5573f"; x.fillRect(-.55, -.8, 1.1, 1.6); x.strokeRect(-.55, -.8, 1.1, 1.6); x.fillStyle = "#f2eee2"; x.fillRect(-.45, -.72, .9, .42); x.strokeRect(-.45, -.72, .9, .42); },
  Rubble(x) { x.fillStyle = "#8f8d85"; [[-.4, .25, .3], [.3, .35, .25], [0, -.2, .36], [-.5, -.4, .18], [.5, -.3, .2]].forEach(([a, b, r]) => { x.beginPath(); x.arc(a, b, r, 0, 7); x.fill(); x.stroke(); }); },
  Skull(x) { x.fillStyle = "#eee8d8"; x.beginPath(); x.arc(0, -.15, .55, 0, 7); x.fill(); x.stroke(); x.fillRect(-.28, .3, .56, .35); x.strokeRect(-.28, .3, .56, .35); x.fillStyle = "#222"; x.beginPath(); x.arc(-.22, -.15, .14, 0, 7); x.arc(.22, -.15, .14, 0, 7); x.fill(); },
};
const STAMP_NAMES = Object.keys(STAMPS);
const TOKEN_COLORS = ["#b3261e", "#23609f", "#1e6b2b", "#7a3fa0", "#b86f12", "#222222"];
const TOOLS = [["select", "Move"], ["paint", "Paint"], ["fill", "Fill"], ["room", "Room"], ["wall", "Wall"], ["door", "Door"], ["stamp", "Stamp"], ["token", "Token"], ["label", "Label"], ["fog", "Fog"], ["measure", "Measure"], ["erase", "Erase"], ["pan", "Pan"]];

function blank(o = {}) {
  const w = o.w || 30, h = o.h || 22;
  return { id: uid(), name: o.name || "Untitled map", kind: o.kind || "square", w, h, scale: o.scale || (o.kind === "hex" ? 6 : 5), unit: o.unit || (o.kind === "hex" ? "mi" : "ft"), grid: true, fogOn: false, base: o.base ?? 1, t: new Array(w * h).fill(o.base ?? 1), fog: new Array(w * h).fill(0), edges: {}, items: [] };
}
function validMap(m) {
  if (!m || typeof m !== "object" || !Number.isInteger(m.w) || !Number.isInteger(m.h) || m.w < 1 || m.h < 1 || m.w > 150 || m.h > 150 || !Array.isArray(m.t) || m.t.length !== m.w * m.h) return null;
  const clean = blank({ w: m.w, h: m.h, kind: m.kind === "hex" ? "hex" : "square", base: 0 });
  clean.id = typeof m.id === "string" ? m.id.slice(0, 40) : clean.id;
  clean.name = String(m.name ?? "Imported map").slice(0, 80);
  clean.scale = Math.max(1, Math.min(1000, +m.scale || 5)); clean.unit = ["ft", "m", "mi", "km"].includes(m.unit) ? m.unit : "ft";
  clean.grid = m.grid !== false; clean.fogOn = !!m.fogOn;
  clean.t = m.t.map((v) => (Number.isInteger(v) && v >= 0 && v < TERRAIN.length ? v : 0));
  clean.fog = Array.isArray(m.fog) && m.fog.length === m.t.length ? m.fog.map((v) => (v ? 1 : 0)) : clean.fog;
  if (m.edges && typeof m.edges === "object") for (const [k, v] of Object.entries(m.edges)) if (/^[hv]:\d+:\d+$/.test(k) && ["wall", "door", "secret"].includes(v)) clean.edges[k] = v;
  clean.items = (Array.isArray(m.items) ? m.items : []).slice(0, 2000).filter((i) => i && ["stamp", "token", "label"].includes(i.type) && isFinite(i.x) && isFinite(i.y)).map((i) => ({
    id: String(i.id ?? uid()).slice(0, 40), type: i.type, x: +i.x, y: +i.y, s: STAMPS[i.s] ? i.s : undefined, text: String(i.text ?? "").slice(0, 120),
    color: /^#[0-9a-f]{6}$/i.test(i.color) ? i.color : "#b3261e", size: Math.max(.5, Math.min(6, +i.size || 1)), gm: !!i.gm }));
  return clean;
}

/* ---------- geometry ---------- */
const HS = G / Math.sqrt(3); // flat-top hex radius, so the hex is G tall
const hexC = (q, r) => ({ x: HS + q * HS * 1.5, y: G / 2 + r * G + (q % 2 ? G / 2 : 0) });
const worldSize = (m) => (m.kind === "hex" ? { w: HS * 2 + (m.w - 1) * HS * 1.5, h: G * m.h + G / 2 } : { w: m.w * G, h: m.h * G });
const center = (m, x, y) => (m.kind === "hex" ? hexC(x, y) : { x: (x + .5) * G, y: (y + .5) * G });
function cellAt(m, px, py) {
  if (m.kind !== "hex") return { x: Math.floor(px / G), y: Math.floor(py / G) };
  const q0 = Math.round((px - HS) / (HS * 1.5)); let best = null, bd = 1e12;
  for (let q = q0 - 1; q <= q0 + 1; q++) { const r0 = Math.round((py - G / 2 - (q % 2 ? G / 2 : 0)) / G); for (let r = r0 - 1; r <= r0 + 1; r++) { const c = hexC(q, r), d = (c.x - px) ** 2 + (c.y - py) ** 2; if (d < bd) { bd = d; best = { x: q, y: r }; } } }
  return best;
}
const inMap = (m, c) => c.x >= 0 && c.y >= 0 && c.x < m.w && c.y < m.h;
const idx = (m, x, y) => y * m.w + x;
const cube = (q, r) => { const z = r - (q - (q & 1)) / 2; return { x: q, z, y: -q - z }; };
const cellDist = (m, a, b) => { if (m.kind !== "hex") return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); const p = cube(a.x, a.y), q = cube(b.x, b.y); return (Math.abs(p.x - q.x) + Math.abs(p.y - q.y) + Math.abs(p.z - q.z)) / 2; };
function neighbors(m, c) {
  if (m.kind !== "hex") return [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([a, b]) => ({ x: c.x + a, y: c.y + b }));
  const o = c.x & 1 ? [[1, 0], [-1, 0], [0, -1], [0, 1], [1, 1], [-1, 1]] : [[1, 0], [-1, 0], [0, -1], [0, 1], [1, -1], [-1, -1]];
  return o.map(([a, b]) => ({ x: c.x + a, y: c.y + b }));
}
function hexPath(x, c) { x.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i, X = c.x + HS * Math.cos(a), Y = c.y + HS * Math.sin(a); i ? x.lineTo(X, Y) : x.moveTo(X, Y); } x.closePath(); }

/* ---------- state ---------- */
let maps = lsGet(LS, []).map(validMap).filter(Boolean), map = null;
let tool = "paint", terrain = 1, stampName = "Tree", brush = 1, fogMode = "reveal", tokenColor = TOKEN_COLORS[0], itemGM = false;
let view = { x: 0, y: 0, z: 1 }, selected = null, drag = null, ghost = null;
let undoStack = [], redoStack = [], saveTimer = 0;
const chan = "BroadcastChannel" in window ? new BroadcastChannel("tablekit-map") : null;
const cv = $("c"), ctx = cv.getContext("2d");

function snapshot() { undoStack.push(JSON.stringify(map)); if (undoStack.length > 60) undoStack.shift(); redoStack = []; syncButtons(); }
function restore(from, to) { if (!from.length) return; to.push(JSON.stringify(map)); const m = JSON.parse(from.pop()); const i = maps.findIndex((x) => x.id === map.id); maps[i] = m; map = m; selected = null; refreshForm(); changed(); syncButtons(); }
function syncButtons() { if (isPlayer) return; $("undo").disabled = !undoStack.length; $("redo").disabled = !redoStack.length; }
function changed() { draw(); if (isPlayer) return; clearTimeout(saveTimer); saveTimer = setTimeout(() => { lsPut(LS, maps); lsPut(LS + "-current", map.id); chan?.postMessage({ id: map.id, map }); }, 180); }

/* ---------- drawing ---------- */
function resize() { const r = cv.parentElement.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); draw(); }
function fit() { const r = cv.parentElement.getBoundingClientRect(), s = worldSize(map), z = Math.min(r.width / (s.w + G), r.height / (s.h + G)); view.z = Math.max(.1, Math.min(4, z)); view.x = (r.width - s.w * view.z) / 2; view.y = (r.height - s.h * view.z) / 2; draw(); }
function paintMap(x, m, o) {
  const s = worldSize(m);
  x.fillStyle = "#efe7d3"; x.fillRect(0, 0, s.w, s.h);
  for (let cy = 0; cy < m.h; cy++) for (let cx = 0; cx < m.w; cx++) {
    const c = TERRAIN[m.t[idx(m, cx, cy)]].c; if (!c) continue; x.fillStyle = c;
    if (m.kind === "hex") { hexPath(x, hexC(cx, cy)); x.fill(); x.strokeStyle = c; x.lineWidth = .6; x.stroke(); } else x.fillRect(cx * G - .3, cy * G - .3, G + .6, G + .6);
  }
  if (m.grid) {
    x.strokeStyle = "rgba(20,40,63,.22)"; x.lineWidth = 1;
    if (m.kind === "hex") { for (let cy = 0; cy < m.h; cy++) for (let cx = 0; cx < m.w; cx++) { hexPath(x, hexC(cx, cy)); x.stroke(); } }
    else { x.beginPath(); for (let i = 0; i <= m.w; i++) { x.moveTo(i * G, 0); x.lineTo(i * G, m.h * G); } for (let i = 0; i <= m.h; i++) { x.moveTo(0, i * G); x.lineTo(m.w * G, i * G); } x.stroke(); }
  }
  x.lineCap = "round";
  for (const [k, v] of Object.entries(m.edges)) {
    if (v === "secret" && o.player) continue;
    const [d, a, b] = k.split(":"), ex = +a * G, ey = +b * G, tx = d === "h" ? ex + G : ex, ty = d === "h" ? ey : ey + G;
    x.strokeStyle = "#1c1a17"; x.lineWidth = 5; x.beginPath(); x.moveTo(ex, ey); x.lineTo(tx, ty); x.stroke();
    if (v !== "wall") {
      const mx = (ex + tx) / 2, my = (ey + ty) / 2, wd = d === "h" ? 22 : 9, ht = d === "h" ? 9 : 22;
      x.fillStyle = v === "door" ? "#a4713c" : "#7a3fa0"; x.lineWidth = 1.5; x.fillRect(mx - wd / 2, my - ht / 2, wd, ht); x.strokeRect(mx - wd / 2, my - ht / 2, wd, ht);
      if (v === "secret") { x.fillStyle = "#fff"; x.font = "700 11px Georgia,serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("S", mx, my + .5); }
    }
  }
  for (const it of m.items) {
    if (o.player && it.gm) continue;
    if (o.player && m.fogOn) { const c = cellAt(m, it.x, it.y); if (inMap(m, c) && !m.fog[idx(m, c.x, c.y)]) continue; }
    x.save(); x.translate(it.x, it.y); if (it.gm) x.globalAlpha = .62;
    if (it.type === "stamp") { const r = G * .46 * it.size; x.scale(r, r); x.strokeStyle = "#1c1a17"; x.lineWidth = 1.6 / r; x.lineJoin = "round"; STAMPS[it.s]?.(x); }
    else if (it.type === "token") {

/* ---------- panels ---------- */

}

function refreshForm() {

  const p = $("pick"); p.innerHTML = ""; maps.forEach((m) => p.append(new Option(m.name, m.id))); p.value = map.id; renderOpt();
}
function resizeMap(w, h) {

function openMap(id) { const m = maps.find((x) => x.id === id); if (!m) return; map = m; undoStack = []; redoStack = []; selected = null; syncButtons(); refreshForm(); fit(); changed(); }
function addMap(m) { maps.push(m); openMap(m.id); }

  const b = document.createElement("div"); b.className = "bar"; b.style.marginTop = "12px"; const ok = document.createElement("button"); ok.className = "primary"; ok.textContent = "Add"; ok.value = "ok"; const no = document.createElement("button"); no.textContent = "Cancel"; no.value = "no"; b.append(ok, no); f.append(h, i, b);

function savePNG(player) {

const safe = (n) => n.replace(/[^\w -]+/g, "").trim() || "map";
function download(blob, name) { const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); }

/* ---------- wiring ---------- */
function wire() {
  $("new").onclick = newDialog; $("gen").onclick = genDialog;
  $("undo").onclick = () => restore(undoStack, redoStack); $("redo").onclick = () => restore(redoStack, undoStack);
  $("zi").onclick = () => zoomAt(1.25, midEye()); $("zo").onclick = () => zoomAt(.8, midEye()); $("zf").onclick = fit;
  $("pick").onchange = (e) => openMap(e.target.value);

function boot() {
  const wanted = location.hash.slice(1);
  if (isPlayer) {
