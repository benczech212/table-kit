<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story Manager</title>
<meta name="description" content="A linked campaign notebook for sessions, quests, NPCs, places, factions and secrets.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Grenze:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared.css">
<style>
.top { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5 }
.top h1 { font-size:1.7rem }
.top select { width:auto; max-width:230px }
.top .grow { flex:1 }
.top .suite { padding:0; font-size:.88rem }
.tabs { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px 0; max-width:1320px; margin:0 auto }
main { max-width:1320px; margin:0 auto; padding:12px 16px 40px }
#msg { min-height:1.3em; color:var(--soft); font-size:.9rem; padding:0 16px; max-width:1320px; margin:6px auto 0 }
.dash { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:12px; align-items:start }
.lib { display:grid; grid-template-columns:minmax(230px,300px) minmax(0,1fr); gap:12px; align-items:start }
.list { display:flex; flex-direction:column; gap:3px; max-height:calc(100vh - 250px); overflow:auto; margin-top:8px }
.li { display:block; width:100%; text-align:left; justify-content:flex-start; padding:6px 9px; min-height:0 }
.li small { display:block; color:var(--soft); font-size:.78rem }
.li[aria-current="true"] { border:2px solid var(--accent); padding:5px 8px }
.pill { display:inline-block; font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; padding:0 6px; border-radius:2px; background:var(--tint); color:var(--soft); margin-right:4px }
.pill.st-active,.pill.st-next { background:var(--okbg); color:var(--ok) }
.pill.st-failed,.pill.st-dead { background:var(--badbg); color:var(--bad) }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px }
.body { margin-top:6px }
.render p { margin:0 0 8px; overflow-wrap:anywhere }
.render ul { margin:0 0 8px; padding-left:20px }
a.wl { font-weight:700; cursor:pointer }
a.wl.missing { color:var(--bad); font-weight:500; text-decoration-style:dashed }
.gm { border-left:4px solid var(--accent); padding:6px 10px; background:var(--tint); margin-top:8px }
.checks label { display:flex; gap:6px; align-items:flex-start; padding:2px 0 }
.checks input[type=text] { flex:1 }
.board { display:grid; grid-template-columns:repeat(4,minmax(190px,1fr)); gap:10px; overflow-x:auto }
.col { background:var(--card); border:1px solid var(--line); border-radius:3px; padding:8px; min-height:140px }
.col h3 { display:flex; justify-content:space-between }
.qcard { border:1px solid var(--line); border-radius:3px; background:var(--field); padding:6px 8px; margin-top:6px }
.qcard .bar { margin-top:4px }
.qcard button { min-height:28px; padding:2px 7px; font-size:.82rem }
.tl { list-style:none; margin:0; padding:0 0 0 16px; border-left:3px solid var(--line) }
.tl li { position:relative; padding:0 0 12px 8px }
.tl li::before { content:""; position:absolute; left:-24px; top:6px; width:13px; height:13px; background:var(--accent); transform:rotate(45deg) }
.web { width:100%; height:min(70vh,680px); display:block; background:var(--card); border:1px solid var(--line); border-radius:3px; touch-action:none }
.web text { font:600 12px var(--body); fill:var(--ink); paint-order:stroke; stroke:var(--card); stroke-width:3px; pointer-events:none }
.web line { stroke:var(--line); stroke-width:1.4 }
.web circle { stroke:var(--card); stroke-width:2; cursor:pointer }
.legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.85rem; margin:0 0 8px }
.dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:4px; vertical-align:-1px }
body.pv .gmonly { display:none !important }
@media (max-width:800px) { .lib { grid-template-columns:minmax(0,1fr) } .list { max-height:230px } .board { grid-template-columns:repeat(4,minmax(200px,1fr)) } }
@media print { .top,.tabs,#msg,.noprint { display:none !important } body { background:#fff } }
</style></head>
